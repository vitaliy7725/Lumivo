<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1e293b">
<title>Lumivo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; height: 100dvh; overflow: hidden; background: #0f172a; }
  body { display: flex; -webkit-font-smoothing: antialiased; }
  .app { width: 100%; height: 100%; display: flex; background: #1e293b; overflow: hidden; position: relative; }
  #authScreen { position: fixed; inset: 0; background: #0f172a; z-index: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  #authScreen h1 { color: #3b82f6; font-size: 32px; font-weight: 800; margin-bottom: 30px; letter-spacing: 2px; }
  .auth-box { width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 15px; background: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .auth-box input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: #f1f5f9; outline: none; font-size: 16px; }
  .auth-box input:focus { border-color: #3b82f6; }
  .auth-box button { width: 100%; padding: 14px; border: none; border-radius: 12px; background: #3b82f6; color: white; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
  .auth-box button:hover { background: #2563eb; }
  .auth-switch { text-align: center; color: #94a3b8; font-size: 14px; margin-top: 15px; cursor: pointer; }
  .hidden { display: none !important; }
  .sidebar { position: absolute; inset: 0; display: flex; flex-direction: column; background: #1e293b; z-index: 2; transition: transform 0.25s ease; }
  .sidebar.hidden-mobile { transform: translateX(-100%); pointer-events: none; }
  .sidebar-header { padding: calc(12px + env(safe-area-inset-top)) 16px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; flex-shrink: 0; }
  .sidebar-header h1 { font-size: 20px; color: #3b82f6; font-weight: 700; }
  #newChatBtn { width: 38px; height: 38px; border-radius: 50%; border: none; background: #3b82f6; color: white; font-size: 22px; cursor: pointer; }
  .tabs { display: flex; border-bottom: 1px solid #334155; flex-shrink: 0; }
  .tab { flex: 1; padding: 12px; text-align: center; color: #94a3b8; font-size: 14px; font-weight: 600; cursor: pointer; border: none; background: transparent; }
  .tab.active { color: #3b82f6; border-bottom: 3px solid #3b82f6; }
  .tab-content { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .tab-content.hidden { display: none; }
  .search { padding: 10px 16px; flex-shrink: 0; }
  .search input { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #f1f5f9; outline: none; font-size: 16px; }
  .chat-list { flex: 1; overflow-y: auto; list-style: none; }
  .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #273449; }
  .chat-item:active { background: #273449; }
  .chat-item.active { background: #334155; border-left: 3px solid #3b82f6; }
  .avatar { width: 46px; height: 46px; border-radius: 50%; background: #3b82f6; color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; flex-shrink: 0; font-size: 16px; }
  .chat-item-info { flex: 1; min-width: 0; }
  .chat-item-info h3 { font-size: 15px; color: #f1f5f9; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item-info p { font-size: 13px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-area { position: absolute; inset: 0; display: flex; flex-direction: column; background: #0f172a; z-index: 3; transform: translateX(100%); transition: transform 0.25s ease; }
  .chat-area.active { transform: translateX(0); }
  .chat-window { flex: 1; display: flex; flex-direction: column; min-height: 0; height: 100%; }
  .chat-header { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; border-bottom: 1px solid #334155; background: #1e293b; flex-shrink: 0; }
  #backBtn { width: 36px; height: 36px; border: none; background: transparent; color: #3b82f6; font-size: 24px; cursor: pointer; }
  .chat-header .avatar { width: 40px; height: 40px; }
  .chat-info { flex: 1; min-width: 0; }
  .chat-info h2 { font-size: 16px; color: #f1f5f9; }
  .chat-info .status { font-size: 12px; color: #22c55e; }
  .chat-actions { display: flex; gap: 4px; }
  .action-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: transparent; color: #3b82f6; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .action-btn svg { width: 22px; height: 22px; fill: currentColor; }
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .message { max-width: 78%; padding: 9px 13px; border-radius: 16px; font-size: 15px; line-height: 1.4; color: #f1f5f9; word-wrap: break-word; white-space: pre-wrap; }
  .message.incoming { background: #334155; align-self: flex-start; border-bottom-left-radius: 4px; }
  .message.outgoing { background: #3b82f6; align-self: flex-end; border-bottom-right-radius: 4px; }
  .message-time { font-size: 11px; opacity: 0.7; margin-top: 3px; display: block; text-align: right; }
  .message-form { display: flex; gap: 6px; align-items: center; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid #334155; background: #1e293b; flex-shrink: 0; }
  .message-form input[type="text"] { flex: 1; min-width: 0; padding: 12px 16px; border-radius: 22px; border: 1px solid #334155; background: #0f172a; color: #f1f5f9; outline: none; font-size: 16px; }
  .message-form button[type="submit"] { width: 46px; height: 46px; border: none; border-radius: 50%; background: #3b82f6; color: white; font-size: 18px; cursor: pointer; }
  @media (min-width: 768px) {
    body { padding: 20px; align-items: center; justify-content: center; }
    .app { max-width: 1100px; height: 90vh; border-radius: 16px; }
    .sidebar { position: relative; width: 320px; flex-shrink: 0; border-right: 1px solid #334155; transform: none !important; pointer-events: auto !important; }
    .chat-area { position: relative; flex: 1; transform: none !important; }
    #backBtn { display: none; }
  }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 150; display: none; align-items: flex-end; }
  .modal.active { display: flex; }
  .modal-panel { width: 100%; background: #1e293b; border-radius: 20px 20px 0 0; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .modal-panel h3 { color: #f1f5f9; font-size: 16px; }
  .modal-panel input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: #f1f5f9; outline: none; font-size: 16px; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions button { flex: 1; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; }
  .btn-cancel { background: #334155; color: #f1f5f9; }
  .btn-submit { background: #3b82f6; color: white; }
</style>
</head>
<body>

<div id="authScreen">
  <h1>Lumivo</h1>
  <div class="auth-box">
    <input type="email" id="authEmail" placeholder="Ваш Email">
    <input type="password" id="authPassword" placeholder="Пароль (мин. 6 символов)">
    <input type="text" id="authName" placeholder="Ваше имя" class="hidden">
    <button id="authBtn">Войти</button>
    <div class="auth-switch" id="authSwitch">Нет аккаунта? Зарегистрироваться</div>
  </div>
</div>

<div class="app hidden" id="appContainer">
  <aside class="sidebar" id="sidebar">
    <header class="sidebar-header">
      <h1>Lumivo</h1>
      <button id="newChatBtn" title="Новый контакт">+</button>
    </header>
    <div class="tabs">
      <button class="tab active">Чаты</button>
    </div>
    <div class="tab-content" id="chatsTab">
      <div class="search"><input type="text" id="searchInput" placeholder="Поиск..."></div>
      <ul class="chat-list" id="chatList"></ul>
    </div>
  </aside>

  <main class="chat-area" id="chatArea">
    <div class="chat-window" id="chatWindow">
      <header class="chat-header">
        <button id="backBtn">‹</button>
        <div class="avatar" id="chatAvatar">?</div>
        <div class="chat-info">
          <h2 id="chatName">Чат</h2>
          <span class="status" id="chatStatus">в сети</span>
        </div>
      </header>
      <div class="messages" id="messages"></div>
      <form class="message-form" id="messageForm">
        <input type="text" id="messageInput" placeholder="Сообщение..." autocomplete="off">
        <button type="submit">➤</button>
      </form>
    </div>
  </main>
</div>

<div class="modal" id="contactModal">
  <div class="modal-panel">
    <h3>Найти пользователя</h3>
    <p style="color: #94a3b8; font-size: 13px;">Введите Email друга.</p>
    <input type="email" id="contactEmail" placeholder="Email друга">
    <div class="modal-actions"><button id="cancelContact" class="btn-cancel">Отмена</button><button id="saveContact" class="btn-submit">Найти</button></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
  import { getFirestore, collection, doc, setDoc, getDoc, getDocs, query, where, onSnapshot, addDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCejK7kea6o-RowFcgL4q90tx8b-MTsUI",
    authDomain: "lumivo-770c2.firebaseapp.com",
    projectId: "lumivo-770c2",
    storageBucket: "lumivo-770c2.firebasestorage.app",
    messagingSenderId: "266325523216",
    appId: "1:266325523216:web:8b2fac16a6b6ed83994395"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let currentUserData = null;
  let activeChatId = null;
  let unsubscribeMessages = null;

  const authScreen = document.getElementById('authScreen');
  const appContainer = document.getElementById('appContainer');
  const authEmail = document.getElementById('authEmail');
  const authPassword = document.getElementById('authPassword');
  const authName = document.getElementById('authName');
  const authBtn = document.getElementById('authBtn');
  const authSwitch = document.getElementById('authSwitch');
  const chatListEl = document.getElementById('chatList');
  const messagesEl = document.getElementById('messages');
  const messageFormEl = document.getElementById('messageForm');
  const messageInputEl = document.getElementById('messageInput');
  const chatNameEl = document.getElementById('chatName');
  const chatAvatarEl = document.getElementById('chatAvatar');
  const chatAreaEl = document.getElementById('chatArea');
  const sidebarEl = document.getElementById('sidebar');
  const backBtn = document.getElementById('backBtn');
  const contactModal = document.getElementById('contactModal');
  const contactEmail = document.getElementById('contactEmail');
  const newChatBtn = document.getElementById('newChatBtn');
  const cancelContact = document.getElementById('cancelContact');
  const saveContact = document.getElementById('saveContact');

  let isLoginMode = true;

  authSwitch.addEventListener('click', () => {
    isLoginMode = !isLoginMode;
    if (isLoginMode) {
      authName.classList.add('hidden');
      authBtn.textContent = 'Войти';
      authSwitch.textContent = 'Нет аккаунта? Зарегистрироваться';
    } else {
      authName.classList.remove('hidden');
      authBtn.textContent = 'Зарегистрироваться';
      authSwitch.textContent = 'Уже есть аккаунт? Войти';
    }
  });

  authBtn.addEventListener('click', async () => {
    const email = authEmail.value.trim();
    const pass = authPassword.value.trim();
    const name = authName.value.trim();
    if (!email || !pass) return alert('Заполните Email и пароль');
    if (!isLoginMode && !name) return alert('Введите имя');
    authBtn.disabled = true;
    authBtn.textContent = 'Загрузка...';
    try {
      if (isLoginMode) {
        await signInWithEmailAndPassword(auth, email, pass);
      } else {
        const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
        await setDoc(doc(db, "users", userCredential.user.uid), {
          uid: userCredential.user.uid, email: email, name: name, createdAt: new Date().toISOString()
        });
      }
    } catch (error) {
      alert('Ошибка: ' + error.message);
      authBtn.disabled = false;
      authBtn.textContent = isLoginMode ? 'Войти' : 'Зарегистрироваться';
    }
  });

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      const docRef = doc(db, "users", user.uid);
      const docSnap = await getDoc(docRef);
      if (docSnap.exists()) currentUserData = docSnap.data();
      authScreen.classList.add('hidden');
      appContainer.classList.remove('hidden');
      loadChats();
    } else {
      currentUser = null;
      currentUserData = null;
      authScreen.classList.remove('hidden');
      appContainer.classList.add('hidden');
      authBtn.disabled = false;
      authBtn.textContent = isLoginMode ? 'Войти' : 'Зарегистрироваться';
    }
  });

  async function loadChats() {
    if (!currentUser) return;
    const q = query(collection(db, "chats"), where("participants", "array-contains", currentUser.uid));
    onSnapshot(q, (snapshot) => {
      chatListEl.innerHTML = '';
      snapshot.forEach((docSnap) => {
        const chat = docSnap.data();
        const otherId = chat.participants.find(id => id !== currentUser.uid);
        const otherName = chat.participantNames[otherId] || "Пользователь";
        const li = document.createElement('li');
        li.className = 'chat-item';
        li.innerHTML = `<div class="avatar">${otherName.charAt(0).toUpperCase()}</div><div class="chat-item-info"><h3>${otherName}</h3><p>Нажмите, чтобы открыть</p></div>`;
        li.addEventListener('click', () => openChat(docSnap.id, otherName));
        chatListEl.appendChild(li);
      });
    });
  }

  async function openChat(chatId, otherName) {
    activeChatId = chatId;
    chatNameEl.textContent = otherName;
    chatAvatarEl.textContent = otherName.charAt(0).toUpperCase();
    if (window.innerWidth < 768) { sidebarEl.classList.add('hidden-mobile'); chatAreaEl.classList.add('active'); }
    if (unsubscribeMessages) unsubscribeMessages();
    const q = query(collection(db, "chats", chatId, "messages"), orderBy("createdAt", "asc"));
    unsubscribeMessages = onSnapshot(q, (snapshot) => {
      messagesEl.innerHTML = '';
      snapshot.forEach((docSnap) => {
        const msg = docSnap.data();
        const isMine = msg.senderId === currentUser.uid;
        const div = document.createElement('div');
        div.className = 'message ' + (isMine ? 'outgoing' : 'incoming');
        div.innerHTML = `${msg.text}<span class="message-time">${new Date(msg.createdAt).toLocaleTimeString().slice(0,5)}</span>`;
        messagesEl.appendChild(div);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }

  backBtn.addEventListener('click', () => {
    chatAreaEl.classList.remove('active');
    sidebarEl.classList.remove('hidden-mobile');
    activeChatId = null;
    if (unsubscribeMessages) unsubscribeMessages();
  });

  messageFormEl.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = messageInputEl.value.trim();
    if (!text || !activeChatId) return;
    messageInputEl.value = '';
    try {
      await addDoc(collection(db, "chats", activeChatId, "messages"), {
        text: text, senderId: currentUser.uid, createdAt: new Date().toISOString()
      });
      await setDoc(doc(db, "chats", activeChatId), {
        lastMessage: text, updatedAt: new Date().toISOString()
      }, { merge: true });
    } catch (error) { alert('Ошибка отправки: ' + error.message); }
  });

  newChatBtn.addEventListener('click', () => contactModal.classList.add('active'));
  cancelContact.addEventListener('click', () => contactModal.classList.remove('active'));

  saveContact.addEventListener('click', async () => {
    const email = contactEmail.value.trim();
    if (!email) return;
    saveContact.disabled = true;
    saveContact.textContent = 'Поиск...';
    try {
      const q = query(collection(db, "users"), where("email", "==", email));
      const querySnapshot = await getDocs(q);
      if (querySnapshot.empty) { alert('Пользователь с таким Email не найден.'); return; }
      let targetUser = null;
      querySnapshot.forEach((doc) => { targetUser = doc.data(); });
      if (targetUser.uid === currentUser.uid) { alert('Это ваш Email.'); return; }
      const chatQuery = query(collection(db, "chats"), where("participants", "array-contains", currentUser.uid));
      const chatSnapshot = await getDocs(chatQuery);
      let existingChatId = null;
      chatSnapshot.forEach(doc => {
        const data = doc.data();
        if (data.participants.includes(targetUser.uid)) existingChatId = doc.id;
      });
      if (existingChatId) {
        contactModal.classList.remove('active');
        openChat(existingChatId, targetUser.name);
      } else {
        const newChatRef = doc(collection(db, "chats"));
        await setDoc(newChatRef, {
          participants: [currentUser.uid, targetUser.uid],
          participantNames: { [currentUser.uid]: currentUserData.name, [targetUser.uid]: targetUser.name },
          lastMessage: "Чат создан", updatedAt: new Date().toISOString()
        });
        contactModal.classList.remove('active');
        openChat(newChatRef.id, targetUser.name);
      }
    } catch (error) { alert('Ошибка: ' + error.message); } 
    finally {
      saveContact.disabled = false;
      saveContact.textContent = 'Найти';
      contactEmail.value = '';
    }
  });
</script>
</body>
</html
